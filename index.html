function deleteFolder(id) {
  if (state.folders.length <= 1) return;
  if (!confirm('確定刪除此資料夾？其下項目將移至第一個資料夾。')) return;
  const fallback = state.folders.find(x => x.id !== id).id;
  state.wiki.forEach(w => { if (w.folderId === id) w.folderId = fallback; });
  state.books.forEach(b => { if (b.folderId === id) b.folderId = fallback; });
  state.timeline.forEach(t => { if (t.folderId === id) t.folderId = fallback; });
  state.ideas.forEach(i => { if (i.folderId === id) i.folderId = fallback; });
  state.folders = state.folders.filter(x => x.id !== id);
  if (state.folderFilter === id) state.folderFilter = 'all';
  saveState();
  render();
  openFolderModal();
}

function openQuickIdeaModal() {

  const fOpts = state.folders.map(f => `<option value="${f.id}" ${f.id === defaultF ? 'selected' : ''}>${esc(stripEmojiPrefix(f.name))}</option>`).join('');

function openIdeaBoxModal() {

  const itemsHtml = list.length ? list.map(it => `

function insertIdeaToChapter(ideaId, target) {

  saveState();

}

  openIdeaBoxModal();
  render();
}

let draftWikiRels = [];

  box.innerHTML = fields.map(f => `

function addDraftRel() {
  const targetId = document.getElementById('we-rel-target')?.value;
  const label = (document.getElementById('we-rel-label')?.value || '').trim() || '關聯';
  if (!targetId) return;
  draftWikiRels = draftWikiRels.filter(r => r.targetId !== targetId);
  draftWikiRels.push({ targetId, label });
  document.getElementById('we-rel-label').value = '';
  renderDraftRels();
}

function removeDraftRel(targetId) {
  draftWikiRels = draftWikiRels.filter(r => r.targetId !== targetId);
  renderDraftRels();
}

function renderDraftRels() {
  const el = document.getElementById('we-rels-list');
  if (!el) return;
  el.innerHTML = draftWikiRels.map(r => {
    const t = state.wiki.find(x => x.id === r.targetId);
    return t ? `<span class="badge">${esc(r.label)}：${esc(t.title)} <strong style="cursor:pointer;margin-left:4px;" onclick="removeDraftRel('${r.targetId}')">×</strong></span>` : '';
  }).join('');
}

function saveWikiItem(id) {
  const title = (document.getElementById('we-title')?.value || '').trim();
  if (!title) return alert('請輸入詞條名稱');
  const folderId = document.getElementById('we-folder')?.value || state.folders[0].id;
  const category = document.getElementById('we-cat')?.value || '角色';
  const summary = (document.getElementById('we-summary')?.value || '').trim();
  const body = (document.getElementById('we-body')?.value || '').trim();
  const existing = id ? state.wiki.find(x => x.id === id) : null;
  const attrs = existing && existing.attrs ? Object.assign({}, existing.attrs) : {};
  document.querySelectorAll('.we-attr-inp').forEach(inp => {
    attrs[inp.getAttribute('data-key')] = inp.value.trim();
  });

  const itemId = id || uid('w');
  const customFields = existing && existing.customFields ? existing.customFields : { basic: [], ability: [], extra: [] };
  const record = { id: itemId, folderId, category, title, summary, attrs, customFields, body, relations: draftWikiRels };
  if (id) {
    const idx = state.wiki.findIndex(x => x.id === id);
    if (idx >= 0) state.wiki[idx] = record;
  } else {
    state.wiki.unshift(record);
  }

  draftWikiRels.forEach(r => {
    const target = state.wiki.find(x => x.id === r.targetId);
    if (target) {
      target.relations = target.relations || [];
      if (!target.relations.some(x => x.targetId === itemId)) {
        target.relations.push({ targetId: itemId, label: r.label });
      }
    }
  });

  saveState();
  closeModal();
  render();
}

function deleteWiki(id) {
  if (!confirm('確定刪除此設定詞條？')) return;
  if (state.wikiDetailId === id) state.wikiDetailId = null;
  state.wiki = state.wiki.filter(w => w.id !== id);
  state.wiki.forEach(w => { w.relations = (w.relations || []).filter(r => r.targetId !== id); });
  saveState();
  render();
}

function moveChapter(bookId, volId, idx, dir) {
  const b = state.books.find(x => x.id === bookId);
  const v = b?.volumes.find(x => x.id === volId);
  if (!v) return;
  const target = idx + dir;
  if (target < 0 || target >= v.chapters.length) return;
  const tmp = v.chapters[idx];
  v.chapters[idx] = v.chapters[target];
  v.chapters[target] = tmp;
  saveState();
  render();
}

  if (!v) return;

function openExportVolumeModal(bookId, volId) {
  const b = state.books.find(x => x.id === bookId);
  const v = b?.volumes.find(x => x.id === volId);
  if (!b || !v) return;
  let words = 0;
  (v.chapters || []).forEach(c => { words += countWords(c.content); });
  showModal(`匯出單一分卷：${esc(v.title)}`, `
    <div class="muted" style="margin-bottom:12px;">《${esc(b.title)}》· 共 ${(v.chapters || []).length} 章，累計 ${words.toLocaleString()} 字</div>
    <div class="row-wrap">
      <button class="btn btn-primary" onclick="downloadVolumeFile('${bookId}','${volId}','txt')">下載 .txt 純文字檔</button>
      <button class="btn btn-accent" onclick="downloadVolumeFile('${bookId}','${volId}','md')">下載 .md Markdown 檔</button>
    </div>
  `);
}

function downloadVolumeFile(bookId, volId, ext) {
  const b = state.books.find(x => x.id === bookId);
  const v = b?.volumes.find(x => x.id === volId);
  if (!b || !v) return;
  const lines = [];
  if (ext === 'md') {
    lines.push(`# ${b.title} — ${v.title}\n`);
    (v.chapters || []).forEach(c => {
      lines.push(`## ${c.title}\n\n${c.content || ''}\n`);
    });
  } else {
    lines.push(`《${b.title}》 ${v.title}\n========================================\n`);
    (v.chapters || []).forEach(c => {
      lines.push(`${c.title}\n----------------------------------------\n${c.content || ''}\n\n`);
    });
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${b.title}_${v.title}.${ext}`;
  a.click();
  closeModal();
}

function openExportBookModal(bookId) {
  const b = state.books.find(x => x.id === bookId);
  if (!b) return;
  const lines = [`《${b.title}》\n${b.desc || ''}\n========================================\n`];
  (b.volumes || []).forEach(v => {
    lines.push(`\n【${v.title}】\n`);
    (v.chapters || []).forEach(c => {
      lines.push(`\n${c.title}\n----------------------------------------\n${c.content || ''}\n`);
    });
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${b.title}_全書匯出.txt`;
  a.click();
}

}

function openSnapshotModal(bookId, volId, chapId) {
  const ctx = findChapterContext(bookId, volId, chapId);
  if (!ctx) return;
  const snaps = ctx.chap.snapshots || [];
  const curWords = countWords(ctx.chap.content);

  const listHtml = snaps.length ? snaps.map((s, idx) => {
    const diff = countWords(s.content) - curWords;
    const diffStr = diff === 0 ? '與現行字數相同' : (diff > 0 ? `比現行多 ${diff} 字` : `比現行少 ${Math.abs(diff)} 字`);
    return `
      <div class="card" style="padding:10px;">
        <div class="row-between">
          <strong>${esc(s.note || '手動快照')}</strong>
          <span class="muted" style="font-size:11.5px;">${esc(s.createdAt)}</span>
        </div>
        <div class="muted" style="font-size:12px;margin:4px 0 8px;">${countWords(s.content)} 字（${diffStr}）</div>
        <div class="row-wrap">
          <button class="btn btn-xs" onclick="previewSnapshot('${bookId}','${volId}','${chapId}',${idx})">檢視全文</button>
          <button class="btn btn-xs btn-primary" onclick="restoreSnapshot('${bookId}','${volId}','${chapId}',${idx})">還原此版本</button>
        </div>
      </div>`;
  }).join('') : `<div class="empty-box">尚無歷史快照，大改稿件前可先建立存檔點。</div>`;

  showModal('章節歷史快照', `
    <div class="row-between" style="margin-bottom:12px;">
      <input id="snap-note" class="input" placeholder="快照備註（例如：大改結局前）" />
      <button class="btn btn-accent" onclick="createSnapshot('${bookId}','${volId}','${chapId}')">建立快照</button>

    title: ctx.chap.title, outline: ctx.chap.outline || '', content: ctx.chap.content || ''
  });

function previewSnapshot(bookId, volId, chapId, idx) {
  const ctx = findChapterContext(bookId, volId, chapId);
  const s = ctx?.chap.snapshots?.[idx];
  if (!s) return;
  showModal(`快照預覽：${esc(s.note)}`, `
    <div class="muted" style="margin-bottom:8px;">建立時間：${esc(s.createdAt)}</div>
    <div class="reader-paper" style="max-height:55vh;overflow-y:auto;">${esc(s.content || '（無內容）')}</div>

      <button class="btn btn-sm" onclick="openSnapshotModal('${bookId}','${volId}','${chapId}')">← 返回列表</button>
      <button class="btn btn-primary btn-sm" onclick="restoreSnapshot('${bookId}','${volId}','${chapId}',${idx})">還原此版本</button>
    </div>
  `);

function restoreSnapshot(bookId, volId, chapId, idx) {
  const ctx = findChapterContext(bookId, volId, chapId);
  const s = ctx?.chap.snapshots?.[idx];
  if (!ctx || !s) return;
  ctx.chap.snapshots.unshift({
    id: uid('s'), note: '還原前自動備份', createdAt: nowStr(),
    title: ctx.chap.title, outline: ctx.chap.outline || '', content: ctx.chap.content || ''
  });
  ctx.chap.title = s.title;
  ctx.chap.outline = s.outline;
  ctx.chap.content = s.content;
  ctx.chap.updatedAt = nowStr();
  saveState();
  closeModal();
  render();
}

function openQuickLookupModal() {
  const wikis = state.wiki.filter(w => matchFolder(w.folderId));
  const ideas = state.ideas.filter(i => matchFolder(i.folderId));
  showModal('寫作速查與靈感', `
    <div class="sec-label">設定詞條速覽（點擊插入 [[詞條]]）</div>
    <div class="row-wrap" style="margin-bottom:12px;">
      ${wikis.map(w => `<button class="btn btn-xs" onclick="closeModal();insStr('[[${esc(w.title)}]]')">${esc(w.title)}</button>`).join('') || '<span class="muted">無設定詞條</span>'}
    </div>
    <div class="sec-label">靈感便籤</div>
    ${ideas.map(i => `<div class="card" style="padding:8px 10px;font-size:13px;">${esc(i.text)}</div>`).join('') || '<div class="muted">尚無靈感便籤</div>'}
  `);
}

function openTrackModal() {
  const listHtml = state.tracks.map(t => `
    <div class="row-between" style="padding:7px 0;border-bottom:1px solid var(--border);">
      <div class="row-wrap">
        <span style="width:12px;height:12px;border-radius:50%;background:${esc(t.color)};display:inline-block;"></span>
        <strong>${esc(t.name)}</strong>
      </div>
      ${state.tracks.length > 1 ? `<button class="btn btn-xs" style="color:#B84A2E;" onclick="deleteTrack('${t.id}')">刪除</button>` : ''}
    </div>`).join('');

  showModal('時間線軌道管理', `
    <div class="row-between" style="margin-bottom:12px;">
      <input id="nt-name" class="input" placeholder="新軌道名稱（如：外傳線）" />
      <input id="nt-color" type="color" value="#6B9080" style="width:42px;height:36px;border:none;background:none;" />
      <button class="btn btn-primary" onclick="createTrack()">新增</button>
    </div>
    ${listHtml}
  `);
}

function createTrack() {
  const name = (document.getElementById('nt-name')?.value || '').trim();
  const color = document.getElementById('nt-color')?.value || '#2F3E46';
  if (!name) return;
  state.tracks.push({ id: uid('tr'), name, color });
  saveState();
  openTrackModal();
  render();
}

function deleteTrack(id) {
  if (state.tracks.length <= 1) return;
  const fallback = state.tracks.find(t => t.id !== id).id;
  state.timeline.forEach(ev => { if (ev.trackId === id) ev.trackId = fallback; });
  state.tracks = state.tracks.filter(t => t.id !== id);
  if (state.tlTrackFilter === id) state.tlTrackFilter = 'all';
  saveState();
  openTrackModal();
  render();
}

let draftTlWikiIds = [];
let draftTlChapRefs = [];

function openTlEditModal(id, presetParallelFrom) {
  const existing = id ? state.timeline.find(x => x.id === id) : null;
  const base = existing || presetParallelFrom || null;
  const defaultF = base ? base.folderId : (state.folderFilter !== 'all' ? state.folderFilter : state.folders[0].id);
  const defaultTrack = existing ? existing.trackId : (presetParallelFrom
    ? (state.tracks.find(t => t.id !== presetParallelFrom.trackId)?.id || state.tracks[0].id)
    : (state.tlTrackFilter !== 'all' ? state.tlTrackFilter : state.tracks[0].id));

  draftTlWikiIds = existing ? [...(existing.wikiIds || [])] : [];
  draftTlChapRefs = existing ? JSON.parse(JSON.stringify(existing.chapterRefs || [])) : [];

  const fOpts = state.folders.map(f => `<option value="${f.id}" ${f.id === defaultF ? 'selected' : ''}>${esc(stripEmojiPrefix(f.name))}</option>`).join('');
  const trOpts = state.tracks.map(t => `<option value="${t.id}" ${t.id === defaultTrack ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  const eras = Array.from(new Set(state.timeline.map(e => e.era).filter(Boolean)));
  const eraPills = eras.map(e => `<button type="button" class="btn btn-xs" onclick="document.getElementById('tl-era').value='${esc(e)}'">${esc(e)}</button>`).join('');

  const wikiChips = state.wiki.filter(w => w.folderId === defaultF).map(w => {
    const sel = draftTlWikiIds.includes(w.id);
    return `<button type="button" class="pill ${sel ? 'active' : ''}" onclick="toggleDraftTlWiki(this,'${w.id}')">${esc(w.title)}</button>`;
  }).join('');

  const chapOptions = [];
  state.books.filter(b => b.folderId === defaultF).forEach(b => {
    (b.volumes || []).forEach(v => (v.chapters || []).forEach(c => {
      chapOptions.push({ key: `${b.id}|${v.id}|${c.id}`, label: `《${b.title}》${c.title}` });
    }));
  });
  const chapChips = chapOptions.map(opt => {
    const [bId, vId, cId] = opt.key.split('|');
    const sel = draftTlChapRefs.some(r => r.chapId === cId);
    return `<button type="button" class="pill ${sel ? 'active' : ''}" onclick="toggleDraftTlChap(this,'${bId}','${vId}','${cId}')">${esc(opt.label)}</button>`;
  }).join('');

  showModal(existing ? '編輯時間事件' : (presetParallelFrom ? '新增同時間點並行支線' : '新增時間事件'), `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
      <div>
        <label class="sec-label">資料夾</label>
        <select id="tl-folder" class="select">${fOpts}</select>
      </div>
      <div>
        <label class="sec-label">時間線軌道</label>
        <select id="tl-track" class="select">${trOpts}</select>
      </div>
    </div>
    <label class="sec-label">所屬紀元 / 分段群組</label>
    <input id="tl-era" class="input" style="margin-bottom:4px;" value="${esc(base ? base.era : '')}" placeholder="例如：第一卷・霧港篇" />
    ${eraPills ? `<div class="row-wrap" style="margin-bottom:8px;">${eraPills}</div>` : ''}
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px;">
      <div>
        <label class="sec-label">時間點標記</label>
        <input id="tl-time" class="input" value="${esc(base ? base.timeLabel : '')}" placeholder="例如：星曆 292 年・霜降" />
      </div>
      <div>
        <label class="sec-label">排序權重（同值並行）</label>
        <input id="tl-weight" type="number" class="input" value="${base ? base.weight : (state.timeline.length + 1) * 100}" />
      </div>
    </div>
    <label class="sec-label">事件標題</label>
    <input id="tl-title" class="input" style="margin-bottom:8px;" value="${esc(existing ? existing.title : '')}" />
    <label class="sec-label">事件經過描述</label>
    <textarea id="tl-desc" class="textarea" rows="3" style="margin-bottom:8px;">${esc(existing ? existing.desc : '')}</textarea>
    <label class="sec-label">關聯登場設定詞條</label>
    <div class="row-wrap" style="margin-bottom:8px;">${wikiChips || '<span class="muted">無設定詞條</span>'}</div>
    <label class="sec-label">關聯對應章節</label>
    <div class="row-wrap" style="margin-bottom:12px;">${chapChips || '<span class="muted">無章節</span>'}</div>
    <div style="text-align:right;">
      <button class="btn btn-primary" onclick="saveTimelineEvent('${id || ''}')">儲存事件</button>
    </div>
  `);
}

function toggleDraftTlWiki(btn, wid) {
  const idx = draftTlWikiIds.indexOf(wid);
  if (idx >= 0) { draftTlWikiIds.splice(idx, 1); btn.classList.remove('active'); }
  else { draftTlWikiIds.push(wid); btn.classList.add('active'); }
}

function toggleDraftTlChap(btn, bookId, volId, chapId) {
  const idx = draftTlChapRefs.findIndex(r => r.chapId === chapId);
  if (idx >= 0) { draftTlChapRefs.splice(idx, 1); btn.classList.remove('active'); }
  else { draftTlChapRefs.push({ bookId, volId, chapId }); btn.classList.add('active'); }
}

function saveTimelineEvent(id) {
  const title = (document.getElementById('tl-title')?.value || '').trim();
  if (!title) return alert('請輸入事件標題');
  const rec = {
    id: id || uid('t'),
    folderId: document.getElementById('tl-folder')?.value || state.folders[0].id,
    trackId: document.getElementById('tl-track')?.value || state.tracks[0].id,
    era: (document.getElementById('tl-era')?.value || '').trim() || '未分組紀元',
    timeLabel: (document.getElementById('tl-time')?.value || '').trim(),
    weight: Number(document.getElementById('tl-weight')?.value) || 0,
    title,
    desc: (document.getElementById('tl-desc')?.value || '').trim(),
    wikiIds: draftTlWikiIds,
    chapterRefs: draftTlChapRefs
  };
  if (id) {
    const idx = state.timeline.findIndex(x => x.id === id);
    if (idx >= 0) state.timeline[idx] = rec;
  } else {
    state.timeline.push(rec);
  }
  saveState();
  closeModal();
  render();
}

function addParallelEvent(sourceId) {
  const ev = state.timeline.find(x => x.id === sourceId);
  if (ev) openTlEditModal(null, ev);
}

function deleteTimelineEvent(id) {
  if (!confirm('確定刪除此時間流事件？')) return;
  state.timeline = state.timeline.filter(x => x.id !== id);
  saveState();
  render();
}

let cmpLayoutMode = '2col';

function openParallelCompareModal(ids) {
  const list = ids.map(id => state.timeline.find(x => x.id === id)).filter(Boolean);
  if (!list.length) return;
  const idsJson = esc(JSON.stringify(ids));

  const cardsHtml = list.map(ev => {
    const tr = state.tracks.find(t => t.id === ev.trackId) || { name: '軌道', color: '#2F3E46' };
    const wikis = (ev.wikiIds || []).map(wid => state.wiki.find(w => w.id === wid)?.title).filter(Boolean).join('、');
    const chaps = (ev.chapterRefs || []).map(r => {
      const ctx = findChapterContext(r.bookId, r.volId, r.chapId);
      return ctx ? `<span class="badge" style="cursor:pointer;background:var(--sage-soft);color:#3A6351;" onclick="closeModal();jumpToChapter('${ctx.book.id}','${ctx.vol.id}','${ctx.chap.id}','read',true)">${esc(ctx.chap.title)}</span>` : '';
    }).join('');
    return `
      <div class="cmp-card" style="border-top:3px solid ${esc(tr.color)};">
        <div class="badge" style="background:${esc(tr.color)}18;color:${esc(tr.color)};margin-bottom:4px;">${esc(tr.name)}</div>
        <div style="font-weight:700;font-size:13.5px;color:var(--primary);margin-bottom:4px;">${esc(ev.title)}</div>
        <div style="font-size:12.5px;line-height:1.6;margin-bottom:6px;">${esc(ev.desc || '（無描述）')}</div>
        ${wikis ? `<div class="muted" style="font-size:11.5px;margin-bottom:4px;">登場：${esc(wikis)}</div>` : ''}
        ${chaps ? `<div class="row-wrap">${chaps}</div>` : ''}
      </div>`;
  }).join('');

  showModal(`多視角並排對照（${esc(list[0].timeLabel || '')}）`, `
    <div class="row-between" style="margin-bottom:10px;">
      <span class="muted">共 ${list.length} 條並行支線</span>
      <div class="row-wrap">
        <button class="btn btn-xs ${cmpLayoutMode === '2col' ? 'btn-primary' : ''}" onclick='switchCmpMode("2col",${idsJson})'>雙欄並排</button>
        <button class="btn btn-xs ${cmpLayoutMode === 'stack' ? 'btn-primary' : ''}" onclick='switchCmpMode("stack",${idsJson})'>上下堆疊</button>
      </div>
    </div>
    <div class="${cmpLayoutMode === '2col' ? 'cmp-grid-2' : 'cmp-grid-1'}">${cardsHtml}</div>
  `);
}

function switchCmpMode(mode, ids) {
  cmpLayoutMode = mode;
  openParallelCompareModal(ids);
}

function render() {
  renderTopFolderSelect();
  renderBottomNav();
  const main = document.getElementById('app-main');
  if (!main) return;
  try {
    if (state.activeTab === 'home') main.innerHTML = renderHomeModule();
    else if (state.activeTab === 'wiki') main.innerHTML = renderWikiModule();
    else if (state.activeTab === 'timeline') main.innerHTML = renderTimelineModule();
    else if (state.activeTab === 'books') main.innerHTML = renderBooksModule();
    else if (state.activeTab === 'backup') main.innerHTML = renderBackupModule();
  } catch (err) {
    console.error(err);
    main.innerHTML = `<div class="card empty-box">畫面渲染異常，請重新整理或匯出備份。<br><pre style="font-size:11px;text-align:left;">${esc(err.message)}</pre></div>`;
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (state.activeTab === 'home' || state.activeTab === 'backup') render();
});

async function triggerPwaInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

render();
</script>
</body>
</html>
